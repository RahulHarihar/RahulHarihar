name: Snake

on:
  schedule:
    - cron: "0 */12 * * *" # runs every 12 hours
  workflow_dispatch: # lets you trigger manually from Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff4a1c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4a1c
            dist/github-snake-green.svg?color_snake=#ff4a1c&color_dots=#1a1a1a,#2a2a2a,#3a3a3a,#555555,#ffffff

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
